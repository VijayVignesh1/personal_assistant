[project]
name = "personal-assistant"
version = "0.1.0"
description = "Private personal AI diary and assistant"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "gradio>=6.2",
    "torch>=2.6.0",
    "transformers>=4.56.1",
    "deepeval>=4.2.8",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# numpy arrives transitively via rank-bm25; we never touch it directly.
# It ships py.typed stubs, so mypy follows them, and recent numpy releases
# write PEP 695 `type X = ...` in those stubs. With python_version pinned to
# 3.11 above, mypy rejects that syntax and aborts before checking any of our
# code ("Type statement is only supported in Python 3.12 and greater").
# Because latest numpy dropped Python 3.11, only the 3.12 CI cells resolve a
# stub new enough to trigger it.
# follow_imports_for_stubs is required: follow_imports alone does not apply
# to .pyi files, which is exactly where the offending syntax lives.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
