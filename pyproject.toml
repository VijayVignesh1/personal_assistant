[project]
name = "personal-assistant"
version = "0.1.0"
description = "Private personal AI diary and assistant"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "transformers>=4.56.1",
    "deepeval>=4.2.8",
    "rank-bm25>=0.2.2",
    "ollama>=0.6.3",
    "chainlit>=2.12.0",
    "mlflow>=3.17.2",
    "bs4>=0.0.2",
    "trafilatura>=2.3.1",
    "tiktoken>=0.14.0",
    "psutil>=7.2.2",
    "bitsandbytes>=0.50.2",
    "py-cpuinfo>=9.0.0",
]


[tool.personal-assistant.requirements]
minimum-ram = "8 GB"
recommended-ram = "16 GB"

minimum-storage = "2 GB"
recommended-storage = "10 GB"

[project.optional-dependencies]

ml = [
    "accelerate>=1.15.0",
    "sentence-transformers>=6.1.0",
]

nvidia = [
    "nvidia-ml-py>=13.0"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
    "types-tabulate>=0.10.0.20261006",
    "types-psutil>=7.2.2.20260906",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a GPU",
    "ollama: tests that require ollama connection",
    "web: tests that require access to web"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# numpy arrives transitively via rank-bm25; we never touch it directly.
# It ships py.typed stubs, so mypy follows them, and recent numpy releases
# write PEP 695 `type X = ...` in those stubs. With python_version pinned to
# 3.11 above, mypy rejects that syntax and aborts before checking any of our
# code ("Type statement is only supported in Python 3.12 and greater").
# Because latest numpy dropped Python 3.11, only the 3.12 CI cells resolve a
# stub new enough to trigger it.
# follow_imports_for_stubs is required: follow_imports alone does not apply
# to .pyi files, which is exactly where the offending syntax lives.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pynvml"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[project.scripts]
personal-assistant = "personal_assistant.main:main"
personal-assistant-install = "personal_assistant.installer.installer:main"
personal-assistant-update = "personal_assistant.installer.installer:update"
